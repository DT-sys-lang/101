name: Build Strapi CMS Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/strapi-image.yml"
      - "strapi-cms/**"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push Strapi image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: image
        shell: bash
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="$(basename "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          ref="$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr '/_' '--')"
          image="ghcr.io/${owner}/${repo}-strapi-cms"
          tags="${image}:${ref}
          ${image}:${GITHUB_SHA}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            tags="${tags}
          ${image}:main
          ${image}:latest"
          fi
          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./strapi-cms
          file: ./strapi-cms/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            PUBLIC_URL=
            STRAPI_ADMIN_BACKEND_URL=
